# Build, unit tests and Python tests. Benchmarks are not run here: shared CI machines give meaningless timings.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides whether the slower Windows job runs: always for PRs to main (releases) and manual runs; for PRs to dev only when
    # the build itself changes.
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.decide.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.base_ref }}" = "main" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "windows=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$changed"
          if echo "$changed" | grep -qE '^(CMakeLists\.txt|CMakePresets\.json|cmake/|native/|\.github/workflows/)'; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build libjpeg-dev zlib1g-dev
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc
      - name: Unit tests (ctest)
        run: ctest --preset linux-gcc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/pip install -q --no-build-isolation -e .
      - name: Python tests (pytest, incl. license headers and runner tests)
        run: .venv/bin/python -m pytest -q

  windows:
    # MSVC build is slower (libjpeg-turbo and zlib are built from source): releases, manual runs, and PRs that change the build.
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: Unit tests (ctest)
        run: ctest --preset windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -q -r requirements-dev.txt
          .venv/Scripts/python -m pip install -q --no-build-isolation -e .
      - name: Python tests
        shell: bash
        run: .venv/Scripts/python -m pytest -q
